name: Run Unit Tests CI
permissions:
  contents: read

on:
  schedule:
  # Runs at 09Z (2am CDT)
    - cron: "0 9 * * *"
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel concurrent runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARM_USERNAME: ${{ secrets.ARM_USERNAME }}
  ARM_PASSWORD: ${{ secrets.ARM_PASSWORD }}
  AIRNOW_API: ${{ secrets.AIRNOW_API }}
  COVERALLS_TOKEN: ${{ secrets.COVERLALLS_REPO_TOKEN }}
  AMERIFLUX_EMAIL: ${{ secrets.AMERIFLUX_EMAIL }}
  AMERIFLUX_USERNAME: ${{ secrets.AMERIFLUX_USERNAME }}
  NEON_API: ${{ secrets.NEON_API }}

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.python-version }}
    if: github.repository == 'ARM-DOE/ACT'
    runs-on: ${{ matrix.os }}-latest
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [macos, ubuntu, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Conda Environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          create-args: python=${{ matrix.python-version }}
          environment-file: ./continuous_integration/environment_actions.yml
          init-shell: >-
            bash
          cache-downloads: true
          post-cleanup: "all"

      - name: Fetch all history for all tags and branches
        run: |
           git fetch --prune --unshallow

      - name: Install ACT
        run: |
          python -m pip install -e . --no-deps --force-reinstall

      - name: Run Linting
        shell: bash -l {0}
        run: |
          ruff check .

      - name: Test with pytest
        run: |
          python -m pytest -v --mpl --cov=./ --cov-report=xml

      - name: Upload code coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
